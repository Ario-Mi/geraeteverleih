name: Demo auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Einmal pro Woche neu bauen, damit Fristen und überfällige Ausleihen
  # in der Demo zum aktuellen Datum passen.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt

      - name: Tests ausführen
        run: python -m pytest -q

      - name: Statische Demo erzeugen
        run: python scripts/build_demo.py --out demo

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Nur den Demo-Ordner hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
